services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: memoryos-postgres
    restart: unless-stopped
    ports:
      - "5438:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: memoryos
    volumes:
      - memoryos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d memoryos"]
      interval: 3s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: memoryos-redis
    restart: unless-stopped
    ports:
      - "6385:6379"
    volumes:
      - memoryos_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  memoryos_pgdata:
  memoryos_redisdata:

