line-length = 120
target-version = "py311"

[lint]
select = ["E", "F", "I", "W", "UP"]
ignore = [
    "E501",  # line length handled by formatter
    "B008",  # Depends in FastAPI route signatures
    "BLE001",# blind exception catch in top-level resilience blocks
]

[format]
quote-style = "double"
indent-style = "space"

